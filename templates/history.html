<!DOCTYPE html>
<html>
<head>
<title>Diagnosis History</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { padding-top:70px; background:linear-gradient(160deg,#ffecd2,#fcb69f); font-family:'Segoe UI'; }
.navbar { position:fixed; top:0; width:100%; background:linear-gradient(to right,#ff4b2b,#ff416c); }
.container { background:white; border-radius:20px; padding:30px; max-width:1100px; margin:auto; box-shadow:0 12px 35px rgba(0,0,0,0.25);}
table img { width:80px; border-radius:12px;}
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
<div class="container-fluid">
<a class="navbar-brand" href="{{ url_for('index') }}">PneumoniaCare 🩺</a>
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Dashboard</a></li>
<li class="nav-item"><a class="nav-link active" href="#">History</a></li>
<li class="nav-item"><a class="nav-link" href="{{ url_for('chatbot_page') }}">Chatbot</a></li>
</ul>
</div>
</nav>

<div class="container mt-4">
<h3 class="text-center mb-3">Diagnosis History</h3>

<form method="POST" action="{{ url_for('clear_history') }}" class="text-end mb-3">
<button class="btn btn-danger btn-sm">Clear History</button>
</form>

<table class="table table-bordered text-center">
<thead class="table-primary">
<tr>
<th>Image</th>
<th>Disease</th>
<th>Confidence</th>
<th>Stage</th>
<th>Time</th>
<th>PDF</th>
</tr>
</thead>
<tbody>
{% for record in history %}
<tr>
<td><img src="{{ url_for('static', filename='uploads/' + record.filename) }}"></td>
<td>{{ record.prediction }}</td>
<td>{{ record.confidence }}%</td>
<td>{{ record.stage }}</td>
<td>{{ record.timestamp }}</td>
<td>
<a href="{{ url_for('download_pdf', record_index=loop.index0) }}"
class="btn btn-primary btn-sm">PDF</a>
</td>
</tr>
{% endfor %}
</tbody>
</table>
</div>

</body>
</html>
