<!DOCTYPE html>
<html>
<head>
<title>Medical AI Chatbot</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { padding-top:70px; background:linear-gradient(160deg,#ffecd2,#fcb69f); font-family:'Segoe UI'; }
.navbar { position:fixed; top:0; width:100%; background:linear-gradient(to right,#ff4b2b,#ff416c); }
.container { background:white; border-radius:20px; padding:30px; max-width:800px; margin:auto; box-shadow:0 12px 35px rgba(0,0,0,0.25);}
.chat-box { height:400px; overflow-y:auto; border-radius:15px; padding:15px; background:#fff4f1; border:2px solid #ff7e5f;}
.message { margin-bottom:12px; padding:10px 15px; border-radius:15px; max-width:75%; }
.user { background:#38f9d7; margin-left:auto; }
.bot { background:#ffe6dc; border-left:4px solid #ff4b2b; }
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
<div class="container-fluid">
<a class="navbar-brand" href="{{ url_for('index') }}">PneumoniaCare 🩺</a>
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Dashboard</a></li>
<li class="nav-item"><a class="nav-link" href="{{ url_for('view_history') }}">History</a></li>
<li class="nav-item"><a class="nav-link active" href="#">Chatbot</a></li>
</ul>
</div>
</nav>

<div class="container mt-4">
<h3 class="text-center mb-4">AI Medical Assistant</h3>

<div id="chatBox" class="chat-box">
<div class="message bot">Hello 👋 Ask me about your diagnosis.</div>
</div>

<input id="msg" class="form-control mt-3" placeholder="Type your question...">
<button class="btn btn-success mt-2 w-100" onclick="send()">Send</button>
</div>

<script>
function send(){
let m = msg.value;
if(!m) return;
chatBox.innerHTML += "<div class='message user'>"+m+"</div>";
msg.value="";
fetch("/api/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message:m})
})
.then(r=>r.json())
.then(d=>{
chatBox.innerHTML += "<div class='message bot'>"+d.reply+"</div>";
chatBox.scrollTop = chatBox.scrollHeight;
});
}
</script>

</body>
</html>
